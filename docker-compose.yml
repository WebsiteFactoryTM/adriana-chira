# Postgres pentru dezvoltare locală.
#
# În producție baza de date este Neon / Vercel Postgres, cu connection string
# POOLED. Local ne trebuie doar un Postgres care să existe, ca Payload să poată
# rula migrațiile și ca `pnpm seed` să aibă unde scrie.
#
#   docker compose up -d      pornește baza de date
#   docker compose down       o oprește (datele rămân în volum)
#   docker compose down -v    o oprește ȘI șterge datele
#
# Datele de acces sunt intenționat banale: containerul ascultă doar pe 127.0.0.1
# și nu conține niciodată date reale de client (regula 11 din STATUS.md §2).

services:
  postgres:
    image: postgres:17-alpine
    container_name: adriana-chira-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: adriana
      POSTGRES_PASSWORD: adriana_local
      POSTGRES_DB: adriana_chira
      # Fără asta, imaginea inițializează cu locale-ul C și sortările
      # diferă de producție la textele cu diacritice.
      LANG: ro_RO.utf8
      POSTGRES_INITDB_ARGS: '--encoding=UTF8'
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - adriana-chira-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U adriana -d adriana_chira']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  adriana-chira-pgdata:
